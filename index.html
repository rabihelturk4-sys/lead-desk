<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161C28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="config.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lead Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: one mobile column (max 680px), sticky header, fixed bottom tab bar, bottom sheets for every action, full-screen calling mode */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E9ECF3; --ink:#141A27; --muted:#5B6477; --line:#DCE0E9;
  --accent:#2446CF; --accent-ink:#FFFFFF; --accent-bg:#E6EBFC;
  --hot:#D23F22; --hot-bg:#FCE9E4; --good:#127E54; --good-bg:#E0F3EA; --warn:#9A6200; --warn-bg:#FFF1D6; --wa:#0F8445; --wa-bg:#DFF3E7;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif; --f-body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,26,39,.06),0 6px 20px rgba(20,26,39,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1119; --surface:#161C28; --surface2:#1F2634; --ink:#ECEFF5; --muted:#99A2B4; --line:#283041;
  --accent:#8299FF; --accent-ink:#0D1119; --accent-bg:#1F2A4E;
  --hot:#FF7255; --hot-bg:#3A1F1A; --good:#43C990; --good-bg:#15332A; --warn:#F2B44A; --warn-bg:#3A2D12; --wa:#3CCB78; --wa-bg:#143323;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1119; --surface:#161C28; --surface2:#1F2634; --ink:#ECEFF5; --muted:#99A2B4; --line:#283041;
  --accent:#8299FF; --accent-ink:#0D1119; --accent-bg:#1F2A4E;
  --hot:#FF7255; --hot-bg:#3A1F1A; --good:#43C990; --good-bg:#15332A; --warn:#F2B44A; --warn-bg:#3A2D12; --wa:#3CCB78; --wa-bg:#143323;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
header h1{font-family:var(--f-display);font-size:19px;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--accent)}
#sync{margin-left:auto;font-size:12px;color:var(--muted)}

main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:20px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .add-ico{background:var(--accent);color:var(--accent-ink);border-radius:10px;width:34px;height:26px;display:grid;place-items:center}
nav.tabs .add-ico svg{width:18px;height:18px}

.hero{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.hero .date{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot b{color:var(--hot)}
.stat.meet b{color:var(--good)}
.focus-line{font-size:13px;color:var(--muted)}
.focus-line b{color:var(--ink);font-weight:500}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:46px;text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface2);color:var(--ink)}
.btn-big{width:100%;font-size:17px;min-height:56px;border-radius:14px}
.btn-danger{background:var(--hot-bg);color:var(--hot)}
.btn:disabled{opacity:.5}

h2.sec{font-family:var(--f-display);font-size:15px;margin:0 0 8px;display:flex;align-items:center;gap:8px;text-wrap:balance}
h2.sec .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
h2.sec.hot .dot{background:var(--hot)} h2.sec.meet .dot{background:var(--good)} h2.sec.due .dot{background:var(--accent)} h2.sec.new .dot{background:var(--warn)}
h2.sec small{color:var(--muted);font-family:var(--f-body);font-weight:500;font-size:13px}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;position:relative}
.av.hot{background:var(--hot-bg);color:var(--hot)}
.rmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rsub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdue{font-size:12px;color:var(--muted);text-align:right;flex:none;max-width:92px;font-variant-numeric:tabular-nums}
.rdue.over{color:var(--hot);font-weight:700}
.empty{background:var(--surface);border-radius:var(--r);padding:16px;color:var(--muted);font-size:14px;border:1px dashed var(--line)}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);letter-spacing:.02em;vertical-align:1px;white-space:nowrap}
.pill.s-hot,.pill.s-nego{background:var(--hot-bg);color:var(--hot)}
.pill.s-meeting,.pill.s-closed{background:var(--good-bg);color:var(--good)}
.pill.s-new{background:var(--warn-bg);color:var(--warn)}
.pill.s-talking{background:var(--accent-bg);color:var(--accent)}
.pill.s-workshop{background:var(--accent-bg);color:var(--accent);border:1px dashed var(--accent)}
.pill.s-pool{background:var(--surface2);color:var(--muted)}
.updbox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.updbox textarea.input{min-height:70px}
.movebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn.mic.on{background:#c62828;color:#fff;border-color:#c62828}
.chip.wa.on{background:var(--wa);border-color:var(--wa);color:#fff}
.cbtn.off{background:var(--surface2);color:var(--muted)}
.pill.s-later{background:var(--surface2);color:var(--muted);border:1px dashed var(--line)}
.pill.ex{background:var(--warn-bg);color:var(--warn)}
.flame{color:var(--hot)}

.search{display:flex;flex-direction:column;gap:10px}
.input,textarea.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
textarea.input{min-height:84px;resize:vertical;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.t-hot.on{background:var(--hot);border-color:var(--hot);color:#fff}
.chip.t-cold.on{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.chip small{opacity:.7;margin-left:4px}

.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hint{font-size:13px;color:var(--muted)}
.det{font-size:14px;color:var(--good);font-weight:500;min-height:20px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.card h3{margin:0;font-family:var(--f-display);font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}

/* briefing */
.brief{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.brief-label{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.07em}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:13px;background:var(--surface2);border-radius:8px;padding:4px 9px}
.bline{font-size:14px}
.bline b{font-weight:700}
.todo{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 11px;font-weight:700;font-size:14px}
.risk{background:var(--hot-bg);color:var(--hot);border-radius:10px;padding:8px 11px;font-weight:700;font-size:14px}
.meetb{background:var(--good-bg);color:var(--good);border-radius:10px;padding:8px 11px;font-weight:700;font-size:14px}

.contact{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cbtn{border:0;border-radius:14px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:14px;text-decoration:none;padding:8px 4px;text-align:center}
.cbtn svg{width:22px;height:22px}
.cbtn small{font-weight:500;font-size:11px;opacity:.8}
.cbtn.call{background:var(--accent);color:var(--accent-ink)}
.cbtn.wa{background:var(--wa);color:#fff}
.cbtn.msg{background:var(--wa-bg);color:var(--wa)}
.contact2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cbtn.botim{background:#E8F3FF;color:#0A66C2}
.cbtn.sm{min-height:46px;flex-direction:row;gap:8px}
.cbtn.sm svg{width:18px;height:18px}
.cbtn.sms{background:var(--accent-bg);color:var(--accent)}
.cbtn.mail{background:var(--surface2);color:var(--ink)}
.cbtn.mail.none{color:var(--muted);font-weight:500}
.tplwrap{display:flex;flex-direction:column;gap:6px}
.copyb{align-self:flex-end;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted)}
.num{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.num button{background:none;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:12px;color:var(--muted)}
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.obtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:52px;padding:8px 10px;font-weight:700;font-size:14px;text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;gap:6px}
.obtn.na{background:var(--surface2);border-color:transparent}
.obtn.nam{background:var(--wa-bg);color:var(--wa);border-color:transparent}
.obtn.ok{background:var(--accent-bg);color:var(--accent);border-color:transparent}
.obtn.mt{background:var(--good-bg);color:var(--good);border-color:transparent}
.obtn.hotb{color:var(--hot)}
.obtn.hotb.on{background:var(--hot);color:#fff;border-color:var(--hot)}
.obtn.lost{color:var(--muted)}

.timeline{display:flex;flex-direction:column}
.crm summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent)}
.crmtext{white-space:pre-wrap;font-size:13px;color:var(--muted);margin-top:8px;max-height:260px;overflow-y:auto;overflow-wrap:anywhere;background:var(--surface2);border-radius:8px;padding:10px}
.tl{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tl:last-child{border-bottom:0}
.tl time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
details.edit{background:var(--surface);border-radius:var(--r);border:1px solid var(--line)}
details.edit summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.edit summary::after{content:"Edit";color:var(--accent);font-weight:500}
details.edit[open] summary::after{content:"Close"}
details.edit .inner{padding:0 14px 16px;display:flex;flex-direction:column;gap:14px}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(8,11,18,.45)}
.sheet{position:relative;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;overflow-y:auto;overscroll-behavior:contain;width:100%;max-width:720px;margin:0 auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .wrap{display:flex;flex-direction:column;gap:14px;padding-block:6px 4px}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:10px auto 4px}
.shead{display:flex;align-items:flex-start;gap:12px}
.shead h2{margin:0;font-family:var(--f-display);font-size:20px;line-height:1.25;flex:1;min-width:0;overflow-wrap:anywhere}
.shead .sub{font-size:13px;color:var(--muted);margin-top:3px}
.x{background:var(--surface2);border:0;border-radius:50%;width:36px;height:36px;flex:none;font-size:18px;line-height:1}
.tpl{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-decoration:none}
.tpl b{font-size:14px;display:flex;gap:8px;align-items:center}
.tpl p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tpl.sug{border-color:var(--wa);background:var(--wa-bg)}
.tpl.sug b::after{content:"Suggested";font-size:11px;background:var(--wa);color:#fff;border-radius:99px;padding:1px 7px;font-weight:700}
[dir=rtl]{text-align:right}

/* focus mode */
#focus{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.fbar{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.fbar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.fbar .prog{flex:1;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.fbar .prog small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.fbar button{background:var(--surface2);border:0;border-radius:10px;padding:8px 14px;font-weight:700}
.fbody{display:flex;flex-direction:column;gap:14px;padding-block:16px}
.fname{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.2;overflow-wrap:anywhere}
.fsub{color:var(--muted);font-size:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.authbox{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding:24px max(16px,env(safe-area-inset-left,0px))}
.authbox h2{font-family:var(--f-display);font-size:30px;margin:8px 0}.authbox h2 span{color:var(--accent)}
#auth{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;padding-top:calc(40px + env(safe-area-inset-top,0px))}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:500;padding:4px 0;text-align:left;text-decoration:none}
.aftercall{background:var(--accent-bg);color:var(--ink);border:2px solid var(--accent);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:15px;scroll-margin-top:80px}
.pill.newbadge{background:var(--hot);color:#fff;letter-spacing:.06em}
.freshban{background:var(--hot);color:#fff;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4}
h2.sec.newsec .dot{background:var(--hot);box-shadow:0 0 0 4px var(--hot-bg)}
nav.tabs button{position:relative}
.tabbadge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--hot);color:#fff;border-radius:99px;font-size:11px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px}
.confirm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<header class="top"><div class="wrap"><h1>Lead<span>Desk</span></h1><span id="sync">Connecting…</span></div></header>
<main><div class="wrap" id="view"><div class="empty">Loading your leads…</div></div></main>
<nav class="tabs"><div class="wrap">
  <button data-act="tab" data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/><circle cx="12" cy="12" r="4"/></svg>Today</button>
  <button data-act="tab" data-tab="leads"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>Leads</button>
  <button data-act="tab" data-tab="add"><span class="add-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Add lead</button>
  <button data-act="tab" data-tab="msgs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5" stroke-linecap="round"/></svg>Messages</button>
</div></nav>
<div id="focus" hidden></div>
<div id="sheetWrap" hidden><div class="scrim" data-act="closeSheet"></div><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>
<div id="auth" hidden></div>

<script>
const $ = s => document.querySelector(s);

/* Bitrix reads form fields like fields[PHONE][0][VALUE]=… (a simple request, no pre-check by the browser) */
function bxForm(obj, pre = '', out = []){
  for (const [k, v] of Object.entries(obj)) {
    if (v === undefined || v === null) continue;
    const key = pre ? pre + '[' + k + ']' : k;
    if (typeof v === 'object') bxForm(v, key, out); else out.push(encodeURIComponent(key) + '=' + encodeURIComponent(v));
  }

}
async function bxCall(method, params = {}, hook = bxHook(), full){
  let r;

  catch (e) { throw {code: 'net', message: 'Bitrix could not be reached from this browser.'}; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) throw {code: j.error || ('http' + r.status), message: j.error_description || ('Bitrix answered ' + r.status)};
  return full ? j : j.result;
}

let bxBusy = false;
async function bxRun(){
  if (bxBusy || !bxQ.length || !bxValid(bxHook())) return; bxBusy = true;
  while (bxQ.length) {
    const job = bxQ.find(j => !bxHeld(j)); if (!job) break;
    try {
      if (job.method === 'ld.junk') { await bxJunk(job.params); bxDrop(job); bxSave(); S.bxErr = ''; continue; }
      if (job.lead && !job.params.id && !(job.params.fields && job.params.fields.ENTITY_ID)) {
        const l = S.leads.get(job.lead); const id = l ? await bxEnsure(l) : '';
        if (!id) throw {code: 'noid', message: 'The lead could not be found or created in Bitrix.'};
        if (job.method === 'crm.timeline.comment.add') job.params.fields.ENTITY_ID = id; else job.params.id = id;
      }
      if (job.method === 'ld.comment') await bxAddComment(job.params.id, job.params.text);
      else if (job.method === 'ld.todo') await bxCall('crm.activity.todo.add', {ownerTypeId: 1, ownerId: job.params.id, deadline: job.params.deadline, title: job.params.title, description: job.params.text});
      else await bxCall(job.method, job.params);
      bxDrop(job); bxSave(); S.bxErr = '';
    } catch (e) {
      if (e.code === 'net' || /^http5/.test(e.code)) { S.bxErr = e.message; break; }   /* offline: keep and retry later */
      S.bxErr = (e.message || e.code) + ' (' + job.what + ')'; bxDrop(job); bxSave(); toast('Bitrix did not take the ' + job.what + ': ' + (e.message || e.code));
    }

}

/* Which ways you have actually used with this lead, most used first (from the history) */
function usedWays(l){
  const n = {}; const add = (k, c = 1) => n[k] = (n[k] || 0) + c;
  for (const h of (l.history || [])) {
    if (h.k === 'talk' || h.k === 'meeting') add('Phone call'); else if (h.k === 'wa') add('WhatsApp'); else if (h.k === 'sms') add('SMS');
    else if (h.k === 'email') add('Email'); else if (h.k === 'botim') add('Botim');
  }
  return Object.entries(n).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, c]) => k + ' (' + c + '×)').join(', ');
}

/* Final email after the 3rd No answer: written to the outbox and sent from your Zoho mailbox by the background service (with your business card).
   Once per lead, only when the lead has an email and it is turned on in Settings → Email. */
function queueNaMail(l, test){

/* Any email for the background sender: text in the lead's language + signature. extra: sendAt (send later), ics (calendar invite) */
function queueMail(l, k, extra = {}){

  const text = tplText(L, k, l).replace(/\n{3,}/g, '\n\n') + (sig ? '\n' + sig : '');

/* Calendar invite (.ics) so the meeting lands in the client's calendar */
function meetingIcs(l){

  const me = S.cfg.myName || 'RTI Real Estate', loc = l.meetLink || (l.meetingKind === 'Office' ? 'RTI Real Estate, Dubai' : l.meetingKind || 'Call');

    'DTSTART:' + z(l.meetingAt), 'DTEND:' + z(l.meetingAt + H), 'SUMMARY:' + e(`Meeting with ${me} – RTI Real Estate`), 'LOCATION:' + e(loc),
    'DESCRIPTION:' + e((l.meetingKind || 'Meeting') + (l.meetLink ? '\nLink: ' + l.meetLink : '')), `ORGANIZER;CN=${e(me)}:mailto:${myEmail()}`,

/* Monthly update email to Pool and Buy later leads that get it by email (max 20 a day, not to anyone contacted in the last week, never after "stop") */
/* Monthly WhatsApp to Pool and Buy later leads: WhatsApp cannot be sent automatically from a phone number,
   so the app lines them up – tap Send, WhatsApp opens with the message ready, send it, come back and the next one is ready */
/* One monthly update per lead, on one channel: WhatsApp if you have chatted there (or there is no email), otherwise email.
   After 6 updates with no reaction it slows down to every 3 months; any contact after an update resets that. */
const hasWaChat = l => (l.history || []).some(h => h.k === 'wa' && !/Monthly WhatsApp/.test(h.txt || ''));
const monthlyByWa = l => digits(l.phone).length >= 7 && !l.waUnsub && (!l.email || l.unsub || hasWaChat(l));
const monthlyGap = l => (l.monthlyN || 0) >= 6 && !((l.lastAt || 0) > (l.monthlyAt || 0)) ? 90*D : 30*D;
const monthlyDue = (l, now = Date.now()) => ['pool','later'].includes(l.stage) && (l.lastAt || 0) < now - 7*D && now - (l.monthlyAt || 0) >= monthlyGap(l);
const monthlyMark = (l, now = Date.now()) => ({monthlyAt: now, monthlyN: (l.lastAt || 0) > (l.monthlyAt || 0) ? 1 : (l.monthlyN || 0) + 1});
const waMonthlyDue = () => [...S.leads.values()].filter(l => monthlyDue(l) && monthlyByWa(l)).sort((a, b) => (a.lastAt || 0) - (b.lastAt || 0)).map(l => l.id);
function startWaRun(){ const q = waMonthlyDue(); if (!q.length) { toast('Everyone got this month\'s WhatsApp'); return; } S.waRun = {q, i: 0, sent: 0}; openSheet('warun', q[0]); }
function waRunNext(){ const r = S.waRun; if (!r) return; r.i++; while (r.i < r.q.length && !S.leads.get(r.q[r.i])) r.i++;
  if (r.i >= r.q.length) { S.waRun = null; closeSheet(); toast(`Done – ${r.sent} monthly WhatsApp sent`); render(); return; }
  openSheet('warun', r.q[r.i]); }
function queueMonthly(){
  if (!S.ready || !S.cfgLoaded || S.cfg.autoMonthly !== true) return;   /* off until you turn it on */
  const day = new Date().toDateString(); let n = S.cfg.monthlyDay === day ? S.cfg.monthlyCount || 0 : 0; const now = Date.now(); let added = 0;
  for (const l of S.leads.values()) {
    if (n >= 20) break;
    if (!l.email || l.unsub || !monthlyDue(l, now) || monthlyByWa(l)) continue;
    queueMail(l, 'monthly_email'); patchLead(l.id, monthlyMark(l, now), null, {quiet: true}); n++; added++;
  }
  if (added) { S.cfg.monthlyDay = day; S.cfg.monthlyCount = n; saveCfg(); }
}
setInterval(queueMonthly, 60*60e3);

  + 'then "Name: <full name>", then the email alone on its own line, then the source (Facebook, Website…), lead number, project or campaign, and every date and comment or note, each on its own line. '

  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);

async function aiRead(file){

const AI_ERR = {key: 'The AI key was not accepted. Check it in Messages → AI picture reading.', busy: 'The AI is busy or your free limit is used up for now. Try again in a minute.',

/* ---------- read a photo on the device (Tesseract OCR, loaded on first use) ---------- */
/* Prepare a photo for reading: right way up, 1600–2400 px wide, grey, dark screens turned light, contrast stretched */
async function prepImage(file){
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: 'from-image'}); } catch (e) { return file; }
  /* Camera photos of a screen carry the screen's pixel grid (moiré): blur it away at ~900 px, then enlarge.

  const photo = /jpe?g|heic|heif/i.test(file.type || '') && bmp.width > 1000;
  const sc = photo ? 900 / bmp.width : bmp.width > 2400 ? 2400 / bmp.width : bmp.width < 1600 ? 1600 / bmp.width : 1;
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);

}

/* Import leads from a backup or from the old Lead Desk. Leads whose phone number is already saved are skipped (no duplicates). */
async function importLeads(text){
  const res = $('#imp_res'); let data;
  try { data = JSON.parse(text); } catch (e) { res.innerHTML = '<div class="banner">That is not a Lead Desk backup. Copy it again from the old Lead Desk.</div>'; return; }
  const list = Array.isArray(data) ? data : (data.leads || []); if (!list.length) { res.innerHTML = '<div class="banner">No leads found in it.</div>'; return; }
  const have = new Set([...S.leads.values()].map(l => digits(l.phone)).filter(Boolean));
  const fsdb = firebase.firestore(); let batch = fsdb.batch(), n = 0, added = 0, skipped = 0;
  for (const l of list) {
    const d = digits(l.phone); if (d && have.has(d)) { skipped++; continue; } if (d) have.add(d);
    const id = (l.id && /^[\w-]+$/.test(l.id)) ? l.id : 'L' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const doc = {...l}; delete doc.id;
    batch.set(db.doc('leads/' + id), doc); added++;
    if (++n === 400) { await batch.commit(); batch = fsdb.batch(); n = 0; }
  }
  if (n) await batch.commit();
  if (data.config && !S.cfgLoaded || (data.config && !Object.keys(S.cfg || {}).length)) await db.doc('config/main').set(data.config);
